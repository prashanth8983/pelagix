# Saved segments over the score table, as structured rules. `match: all` (default) needs every
# rule to hold, `match: any` needs one. Rules may use scores and entity attributes.
# The engine compiles rules to SQL for counts; the app sends the same rules to Zero.
- name: all
  label: Customers
  rules: []
- name: vip
  label: VIPs
  description: Top two LTV deciles among buyers
  rules:
    - {column: ltv_decile, op: ">=", value: 9}
- name: at_risk
  label: At risk
  description: Churn risk above 70%
  rules:
    - {column: churn_risk, op: ">", value: 0.7}
- name: vip_lapsing
  label: VIPs who stopped buying
  rules:
    - {column: ltv_decile, op: ">=", value: 9}
    - {column: days_since_last_order, op: ">", value: 60}
- name: one_and_done
  label: One-time buyers
  rules:
    - {column: order_count, op: "=", value: 1}
- name: never_bought
  label: Never bought
  description: Signed up but no completed order
  rules:
    - {column: order_count, op: "=", value: 0}
- name: vip_texas
  label: VIPs in Texas
  rules:
    - {column: ltv_decile, op: ">=", value: 9}
    - {column: state, op: "=", value: Texas}
- name: email_or_organic
  label: Email or organic
  description: Acquired through email or organic search
  match: any
  rules:
    - {column: traffic_source, op: "in", value: [Email, Organic]}
