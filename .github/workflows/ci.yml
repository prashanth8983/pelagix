name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "engine[dev]"
      - run: python -m scorebase generate retail --users 2000
      - run: python -m scorebase run retail --no-publish
      - run: python -m pytest -q tests
      - run: python -m scorebase validate retail
      - run: python -m scorebase eval retail

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # routeTree.gen.ts is generated by the router plugin, so build once before typechecking.
      - run: pnpm build
        working-directory: app
      - run: pnpm exec tsc --noEmit
        working-directory: app
