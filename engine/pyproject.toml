[project]
name = "scorebase"
license = "MIT"
version = "0.2.0"
description = "Config-driven customer scoring engine: warehouse -> scores -> Postgres"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1", "pyyaml>=6", "psycopg[binary]>=3.2", "sqlglot>=25", "pydantic>=2.7",
  "fastapi>=0.115", "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.12"]
agent = ["langgraph>=1.2", "langchain-openai>=1.7"]
dev = ["pytest>=8", "httpx>=0.27", "langgraph>=1.2", "langchain-openai>=1.7"]

[project.scripts]
scorebase = "scorebase.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
